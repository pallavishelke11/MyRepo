name: Deploy App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: Development
        type: choice
        options:
          - Development
          - Testing
          - Staging
          - Production
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      ecs_cluster:
        description: ECS cluster name
        required: false
        default: sample-app-cluster
      ecs_service:
        description: ECS service name
        required: false
        default: sample-app-service
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'Development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Create infrastructure and ECR repository
        working-directory: ./terraform
        run: terraform apply -auto-approve -var="aws_region=${{ inputs.aws_region || 'us-east-1' }}" -var="image_tag=latest"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t sample-app:$IMAGE_TAG ./app
          docker tag sample-app:$IMAGE_TAG $ECR_REGISTRY/sample-app:$IMAGE_TAG
          docker tag sample-app:$IMAGE_TAG $ECR_REGISTRY/sample-app:latest
          docker push $ECR_REGISTRY/sample-app:$IMAGE_TAG
          docker push $ECR_REGISTRY/sample-app:latest

      - name: Deploy image through Terraform
        working-directory: ./terraform
        run: terraform apply -auto-approve -var="aws_region=${{ inputs.aws_region || 'us-east-1' }}" -var="image_tag=${{ github.sha }}"

      - name: Wait for ECS service
        env:
          ECS_CLUSTER: ${{ inputs.ecs_cluster || 'sample-app-cluster' }}
          ECS_SERVICE: ${{ inputs.ecs_service || 'sample-app-service' }}
          AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION"

      - name: Health check
        working-directory: ./terraform
        run: |
          alb_dns=$(terraform output -raw alb_dns_name)
          curl --fail --retry 10 --retry-delay 15 "http://$alb_dns/health"
